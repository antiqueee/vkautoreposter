<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Repost Sync{% endblock %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           max-width: 980px; margin: 40px auto; padding: 0 16px; color: #222; line-height: 1.5; }
    a { color: #155799; }
    button { font-size: 1rem; padding: 8px 16px; cursor: pointer; }
    h1 { margin-bottom: 8px; }
    .muted { color: #888; font-size: 0.9rem; }
    .row { margin: 12px 0; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f7f7f7; }
    form.inline { display: inline; }
    input[type="url"], input[type="text"] { font-size: 1rem; padding: 8px; width: min(620px, 100%); }
    .danger { color: #b00020; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
