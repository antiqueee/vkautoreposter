<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Подключение ВК...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           max-width: 480px; margin: 80px auto; padding: 0 16px; text-align: center; }
    #status { color: #888; }
    #error { color: #b00020; }
    button { font-size: 1rem; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Подключение ВК</h1>
  <p id="status">Откройте авторизацию через VK ID.</p>
  <p id="error" hidden></p>
  <div id="vkid-container"></div>
  <div class="row">
    <button id="vkid-fallback" type="button" hidden>Открыть VK ID</button>
  </div>
  <form id="f" method="post" action="{{ post_url }}" hidden>
    <input type="hidden" name="access_token" value="">
    <input type="hidden" name="state" value="">
  </form>
  <noscript>
    <p>Для завершения входа нужен JavaScript. Включите его и обновите страницу.</p>
  </noscript>
  <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
  <script>
  (function () {
    const showError = (msg) => {
      document.getElementById('status').textContent = '';
      const err = document.getElementById('error');
      err.textContent = msg + ' ';
      const back = document.createElement('a');
      back.href = '/';
      back.textContent = 'На главную';
      err.appendChild(back);
      err.hidden = false;
    };

    if (!('VKIDSDK' in window)) {
      showError('Не удалось загрузить VK ID SDK.');
      return;
    }

    const VKID = window.VKIDSDK;
    const f = document.getElementById('f');
    const state = {{ state|tojson }};

    VKID.Config.init({
      app: {{ vk_app_id }},
      redirectUrl: {{ redirect_url|tojson }},
      responseMode: VKID.ConfigResponseMode.Callback,
      source: VKID.ConfigSource.LOWCODE,
      scope: {{ vk_scope|tojson }},
      state: state
    });

    const submitToken = (accessToken) => {
      if (!accessToken) {
        showError('VK ID не вернул access token.');
        return;
      }
      f.access_token.value = accessToken;
      f.state.value = state;
      f.submit();
    };

    const onSuccess = (data) => {
      const token = data && (data.access_token || data.accessToken);
      submitToken(token);
    };

    const onError = (error) => {
      const message = (error && (error.error_description || error.message || error.error)) || 'Ошибка авторизации VK ID.';
      showError(message);
    };

    const fallback = document.getElementById('vkid-fallback');
    fallback.hidden = false;

    try {
      const floatingOneTap = new VKID.FloatingOneTap();
      floatingOneTap
        .render({
          appName: 'Repost Sync',
          showAlternativeLogin: true,
          container: document.getElementById('vkid-container')
        })
        .on(VKID.WidgetEvents.ERROR, onError)
        .on(VKID.FloatingOneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
          VKID.Auth.exchangeCode(payload.code, payload.device_id)
            .then(onSuccess)
            .catch(onError);
        });

      fallback.addEventListener('click', function () {
        try {
          floatingOneTap.render();
        } catch (_err) {
          showError('Не удалось открыть VK ID.');
        }
      });
    } catch (err) {
      onError(err);
    }
  })();
  </script>
</body>
</html>
